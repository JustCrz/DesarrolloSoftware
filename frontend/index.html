<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Marjorie Store | Boutique Premium</title>
  
  <!-- Dependencias Externas (Leaflet Map y fuentes premium) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://js.stripe.com/v3/"></script>
  
  <!-- 7 Hojas de Estilo CSS Modularizadas -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/catalog.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/auth.css" />
  
  <style>
    /* Estilos globales rápidos adicionales */
    .noti-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #ff3e3e;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 50%;
      border: 2px solid #000;
      display: none;
    }
    .campana-img {
      width: 28px;
      height: 28px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .campana-img:hover { transform: scale(1.1); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>Marjorie Store</h1>
      <p class="tagline">Moda femenina · Estilo moderno</p>
    </div>
    
    <nav id="userArea">
      <div class="nav-modules">
        <button id="btnInicio" class="nav-link">Inicio</button>
        <button id="btnAdminPanel" class="hidden nav-link">Panel Admin</button>
        <!-- El Catálogo tiene clase .nav-link y texto Catálogo -->
        <button class="nav-link">Catálogo</button>
        <button class="nav-link nav-ofertas" style="color: var(--accent); font-weight: bold;"> Ofertas</button>
        
        <button id="btnPerfil" class="hidden nav-link"> Mi Perfil</button>
        <button id="btnHistorial" class="hidden nav-link">Mis Pedidos</button>

        <div id="notifContainer" class="hidden" style="position: relative; display: inline-block; vertical-align: middle; margin-right: 15px;">
            <div id="btnCampana" style="position: relative; display: inline-block;">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/appointment-reminders--v1.png" alt="Notificaciones" class="campana-img" id="imgCampana">
                <span id="notiCount" class="noti-badge">0</span>
            </div>
            
            <div id="notiBox" class="noti-dropdown hidden" style="position: absolute; right: 0; top: 40px; background: #111; border: 1px solid #333; width: 280px; z-index: 1000; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <div class="noti-header" style="padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="margin:0; font-size: 0.9rem; color: white;">Notificaciones</h4>
                    <button id="btnCloseNoti" style="background:none; border:none; color:white; cursor:pointer; font-size: 1.2rem;">&times;</button>
                </div>
                <div id="notiList" style="max-height: 300px; overflow-y: auto; padding: 10px;">
                    <p class="empty-noti" style="font-size: 0.8rem; color: #666; text-align: center;">No tienes novedades por ahora </p>
                </div>
            </div>
        </div>

        <div id="authButtons" class="auth-group">
          <button id="btnNavLogin" class="btn-sm">Iniciar sesión</button>
          <button id="btnNavRegister" class="btn-sm secondary">Registrarse</button>
        </div>

        <button id="btnCart" class="hidden cart-btn">
          🛒 Carrito <span id="cartCount" class="badge">0</span>
        </button>
        <button id="btnLogout" class="hidden btn-sm secondary">Salir</button>
      </div>
    </nav>
  </div>
</header>

<!-- Contenedor dinámico principal de la SPA -->
<main id="app">
  <div class="loader-container">
    <div class="spinner"></div>
  </div>
</main>

<div id="cartMessage" class="toast"></div>

<!-- Modal de Detalle de Producto / Detalle de Pedido -->
<div id="modalProducto" class="modal-overlay hidden">
  <div class="modal-content">
    <div id="modalBody"></div>
  </div>
</div>

<!-- Modal de Ajuste de Stock -->
<div id="modalAjusteStock" class="modal-overlay hidden">
  <div class="modal-content" style="max-width: 400px;">
    <div class="admin-section-header">
        <h3> Ajuste de Inventario</h3>
        <p>Modifica existencias manualmente.</p>
    </div>
    <div class="input-group">
        <label>Producto</label>
        <select id="selectProductoStock" style="width: 100%; padding: 10px; background: #111; color: white; border: 1px solid #333;"></select>
    </div>
    <div class="input-group" style="margin-top: 15px;">
        <label>Nueva Cantidad Total</label>
        <input type="number" id="inputNuevaCantidad" placeholder="0" style="width: 100%;">
    </div>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn-save-admin" id="btnConfirmarAjusteStock" style="flex: 1;">Actualizar</button>
        <button class="btn-reset-admin" id="btnCerrarAjusteStock" style="flex: 1;">Cerrar</button>
    </div>
  </div>
</div>

<!-- Único punto de entrada Javascript modular -->
<script type="module" src="js/app.js"></script>

</body>
</html>
