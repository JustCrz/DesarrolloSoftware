<section id="register">
  <div class="login-container">
    <div class="login-header">
      <h2>Crear Cuenta</h2>
      <p>Únete a nuestra comunidad de estilo</p>
    </div>
    <div class="login-body">
      <input id="regUser" placeholder="Nombre Completo" />
      <input id="regEmail" type="email" placeholder="Email" />
      <input id="regTelefono" placeholder="Teléfono" />
      <input id="regDireccion" placeholder="Dirección de Envío" />
      <input id="regPass" placeholder="Contraseña" type="password" />
      <div class="actions">
        <button class="btn-login" onclick="register()">Registrar</button>
        <button class="secondary" onclick="showLanding()">Cancelar</button>
      </div>
    </div>
    <p id="regMsg" class="success"></p>
  </div>
</section>
